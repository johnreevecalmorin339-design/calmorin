<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        /* Login Page */
        #login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: #111827;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
            text-align: center;
        }

        .login-box h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #1e293b;
            color: white;
            font-size: 16px;
        }

        .login-box input:focus {
            outline: 2px solid #38bdf8;
        }

        .login-box button {
            width: 100%;
            padding: 13px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #0ea5e9;
        }

        #error-message {
            color: #f87171;
            margin-top: 15px;
            font-size: 14px;
        }

        /* Homepage */
        #home-page {
            display: none;
        }

        nav {
            background: #111827;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #38bdf8;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav ul li a:hover {
            color: #38bdf8;
        }

        .home {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .home-content h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .home-content h1 span {
            color: #38bdf8;
        }

        .home-content p {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #111827;
            color: #94a3b8;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
            }

            nav ul {
                justify-content: center;
                gap: 15px;
            }

            .home-content h1 {
                font-size: 35px;
            }

            .login-box {
                padding: 28px;
            }
        }
    </style>
</head>

<body>

  
    <section id="login-page">
        <div class="login-box">

            <h1>TechStore</h1>
            <p>Login to access your account</p>

            <form id="login-form">
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Login</button>

                <p id="error-message"></p>
            </form>

        </div>
    </section>

    
    <div id="home-page">

        <nav
            <div class="logo">TechStore</div>

            <ul>
                <li><a href="homepage.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="#" id="logout-link">Log out</a></li>
            </ul>
        </nav>

        <section class="home">
            <div class="home-content">

                <h1>Welcome to <span>TechStore</span></h1>

                <p>
                    Your online store for modern and reliable
                    technology products.
                </p>

                <a href="product.html" class="btn">
                    View Products
                </a>

            </div>
        </section>

        <footer>
            <p>johnreevecalmorin@gmail.com</p>
        </footer>

    </div>

    <script>
        const loginForm = document.getElementById("login-form");
        const loginPage = document.getElementById("login-page");
        const homePage = document.getElementById("home-page");
        const errorMessage = document.getElementById("error-message");

        // Demo login credentials
        const correctUsername = "admin";
        const correctPassword = "12345";

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            if (
                username === correctUsername &&
                password === correctPassword
            ) {
                loginPage.style.display = "none";
                homePage.style.display = "block";
                errorMessage.textContent = "";
                document.title = "TechStore - Home";
            } else {
                errorMessage.textContent =
                    "Incorrect username or password.";
            }
        });

        // Log out returns to the login form
        document.getElementById("logout-link")
            .addEventListener("click", function(event) {
                event.preventDefault();

                homePage.style.display = "none";
                loginPage.style.display = "flex";

                loginForm.reset();
                errorMessage.textContent = "";
                document.title = "TechStore - Login";
            });
    </script>

</body>
</html>
