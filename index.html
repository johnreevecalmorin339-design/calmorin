<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0f172a;
            color: white;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            padding: 35px;
            background: #111827;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0ea5e9;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #f87171;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>TechStore</h1>
        <p class="subtitle">Login to your account</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Log In</button>
            <div id="message" role="alert"></div>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (username === "admin" && password === "12345") {
                window.location.href = "techstore_homepage.html";
            } else {
                message.textContent = "Incorrect username or password!";
            }
        });
    </script>

</body>
</html>
